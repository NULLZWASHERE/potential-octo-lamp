<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate theme-light" style="
  --color-primary: rgb(51 144 236);
  --color-primary-opacity: rgb(51 144 236 / 0.11765);
  --color-background: rgb(255 255 255);
  --color-background-secondary: rgb(243 243 245);
  --color-background-own: rgb(238 255 222);
  --color-text: rgb(0 0 0);
  --color-text-secondary: rgb(112 117 121);
  --color-borders: rgb(218 220 224);
  --color-links: rgb(51 144 236);
">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NO FLITER</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background: var(--color-background);
  height: 100vh;
  display: flex;
  flex-direction: column;
  color: var(--color-text);
}

header {
  height: 56px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  background: var(--color-background);
  border-bottom: 1px solid var(--color-borders);
  font-weight: 500;
  font-size: 16px;
  gap: 12px;
  z-index: 10;
}

.header-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #3390ec;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 500;
  color: #fff;
  font-size: 15px;
  overflow: hidden;
}

.header-avatar span {
  font-weight: 700;
  font-size: 14px;
}

.header-info {
  display: flex;
  flex-direction: column;
}

.header-title {
  font-weight: 500;
  font-size: 15px;
  color: var(--color-text);
}

.header-status {
  font-size: 12px;
  color: var(--color-text-secondary);
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background-image: url("back.png");
  background-color: #99BA92;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  max-width: 75%;
}

.row.outgoing {
  margin-left: auto;
  flex-direction: row-reverse;
}

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #3390ec;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 500;
  color: #fff;
  font-size: 13px;
  flex-shrink: 0;
  margin-bottom: 2px;
}

.msg {
  background: var(--color-background);
  padding: 8px 12px 10px 12px;
  border-radius: 12px;
  position: relative;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
  word-break: break-word;
  font-size: 14px;
  line-height: 1.4;
  color: var(--color-text);
  min-width: 140px;
}

.row.outgoing .msg {
  background: var(--color-background-own);
  border-bottom-right-radius: 4px;
}

.row:not(.outgoing) .msg {
  border-bottom-left-radius: 4px;
}

.name {
  font-size: 13px;
  color: #2481cc;
  font-weight: 500;
  margin-bottom: 2px;
}

.row.outgoing .name {
  display: none;
}

.message-content {
  padding-right: 50px;
  margin-bottom: 4px;
}

.meta-info {
  position: absolute;
  right: 8px;
  bottom: 6px;
  display: flex;
  align-items: center;
  gap: 3px;
}

.time {
  font-size: 10px;
  color: var(--color-text-secondary);
}

.row.outgoing .time {
  color: #4a8e3a;
}

.checks {
  font-size: 11px;
  color: #4a8e3a;
  font-weight: bold;
}

.controls {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  background: var(--color-background);
  align-items: center;
  border-top: 1px solid var(--color-borders);
}

input {
  border: none;
  outline: none;
  background: transparent;
  color: var(--color-text);
  font-size: 14px;
  font-family: 'Roboto', sans-serif;
}

#sender {
  width: 100px;
  background: var(--color-background-secondary);
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--color-borders);
}

.input-wrapper {
  flex: 1;
  background: var(--color-background-secondary);
  border-radius: 20px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  border: 1px solid var(--color-borders);
}

#text {
  flex: 1;
  padding: 10px 0;
}

button {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 50%;
  background: #3390ec;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s;
  flex-shrink: 0;
}

button:hover {
  background: #1b73b5;
}

button svg {
  width: 18px;
  height: 18px;
  fill: white;
  transform: translateX(1px);
}

.empty {
  margin: auto;
  color: var(--color-text-secondary);
  font-size: 14px;
  background: rgba(255, 255, 255, 0.85);
  padding: 6px 14px;
  border-radius: 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
</style>
</head>
<body>

<header>
  <div class="header-avatar"><span>NF</span></div>
  <div class="header-info">
    <div class="header-title">NO FLITER</div>
    <div class="header-status">online</div>
  </div>
</header>

<div id="chat">
  <div class="empty">No messages</div>
</div>

<div class="controls">
  <input id="sender" value="Guest" placeholder="Name">
  <div class="input-wrapper">
    <input id="text" placeholder="Write a message...">
  </div>
  <button onclick="sendMessage()" title="Send">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></svg>
  </button>
</div>

<script>
const API_URL = '/api/chat';
let localMessages = [];

function esc(s) {
  return String(s).replace(/[&<>"]/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
  }[m]));
}

function render(msgs) {
  const c = document.getElementById("chat");
  const currentSender = document.getElementById("sender").value.trim() || "Guest";
  
  if (!msgs.length) {
    c.innerHTML = '<div class="empty">No messages</div>';
    return;
  }
  
  c.innerHTML = msgs.map(m => {
    const isOutgoing = m.sender.toLowerCase() === currentSender.toLowerCase();
    const avatarLetter = esc(m.sender).charAt(0).toUpperCase();
    
    return `
      <div class="row ${isOutgoing ? 'outgoing' : ''}">
        <div class="avatar">${avatarLetter}</div>
        <div class="msg">
          <div class="name">${esc(m.sender)}</div>
          <div class="message-content">${esc(m.text)}</div>
          <div class="meta-info">
            <span class="time">${m.timestamp || new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
            ${isOutgoing ? '<span class="checks">✓✓</span>' : ''}
          </div>
        </div>
      </div>`;
  }).join("");
  
  c.scrollTop = c.scrollHeight;
}

async function fetchMessages() {
  try {
    const r = await fetch(API_URL);
    if (!r.ok) throw 0;
    const d = await r.json();
    render(d.messages || []);
  } catch {
    render(localMessages);
  }
}

async function sendMessage() {
  const sender = document.getElementById("sender").value.trim() || "Guest";
  const text = document.getElementById("text").value.trim();
  if (!text) return;
  
  const msg = { 
    sender, 
    text, 
    timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
  };
  
  try {
    const r = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(msg)
    });
    if (!r.ok) throw 0;
    document.getElementById("text").value = "";
    fetchMessages();
  } catch {
    localMessages.push(msg);
    document.getElementById("text").value = "";
    render(localMessages);
  }
}

document.getElementById("text").addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

fetchMessages();
setInterval(fetchMessages, 2000);
</script>

</body>
</html>
