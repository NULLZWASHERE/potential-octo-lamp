<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate theme-light" style="
  --color-primary: rgb(51 144 236);
  --color-primary-opacity: rgb(51 144 236 / 0.11765);
  --color-background: rgb(255 255 255);
  --color-background-secondary: rgb(243 243 245);
  --color-background-own: rgb(238 255 222);
  --color-text: rgb(0 0 0);
  --color-text-secondary: rgb(112 117 121);
  --color-borders: rgb(218 220 224);
  --color-links: rgb(51 144 236);
">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NO FLITER</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  background: var(--color-background);
  height: 100vh;
  display: flex;
  flex-direction: column;
  color: var(--color-text);
  overflow: hidden;
}

header {
  height: 56px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  background: var(--color-background);
  border-bottom: 1px solid var(--color-borders);
  font-weight: 500;
  font-size: 16px;
  gap: 12px;
  z-index: 10;
  justify-content: space-between;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #3390ec;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 500;
  color: #fff;
  font-size: 15px;
  overflow: hidden;
}

.header-avatar span {
  font-weight: 700;
  font-size: 14px;
}

.header-info {
  display: flex;
  flex-direction: column;
}

.header-title {
  font-weight: 500;
  font-size: 15px;
  color: var(--color-text);
}

.header-status {
  font-size: 12px;
  color: var(--color-text-secondary);
}

.logout-btn {
  background: transparent;
  color: var(--color-text-secondary);
  border: 1px solid var(--color-borders);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  width: auto;
  height: auto;
}

.logout-btn:hover {
  background: var(--color-background-secondary);
  color: var(--color-text);
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background-image: url("back.png");
  background-color: #99BA92;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
  max-width: 75%;
}

.row.outgoing {
  margin-left: auto;
  flex-direction: row-reverse;
}

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #3390ec;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 500;
  color: #fff;
  font-size: 13px;
  flex-shrink: 0;
  margin-bottom: 2px;
}

.msg {
  background: var(--color-background);
  padding: 8px 12px 10px 12px;
  border-radius: 12px;
  position: relative;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
  word-break: break-word;
  font-size: 14px;
  line-height: 1.4;
  color: var(--color-text);
  min-width: 140px;
}

.row.outgoing .msg {
  background: var(--color-background-own);
  border-bottom-right-radius: 4px;
}

.row:not(.outgoing) .msg {
  border-bottom-left-radius: 4px;
}

.name {
  font-size: 13px;
  color: #2481cc;
  font-weight: 500;
  margin-bottom: 2px;
}

.row.outgoing .name {
  display: none;
}

.message-content {
  padding-right: 50px;
  margin-bottom: 4px;
}

.meta-info {
  position: absolute;
  right: 8px;
  bottom: 6px;
  display: flex;
  align-items: center;
  gap: 3px;
}

.time {
  font-size: 10px;
  color: var(--color-text-secondary);
}

.row.outgoing .time {
  color: #4a8e3a;
}

.checks {
  font-size: 11px;
  color: #4a8e3a;
  font-weight: bold;
}

.controls {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  background: var(--color-background);
  align-items: center;
  border-top: 1px solid var(--color-borders);
}

input {
  border: none;
  outline: none;
  background: transparent;
  color: var(--color-text);
  font-size: 14px;
  font-family: 'Roboto', sans-serif;
}

#sender {
  width: 100px;
  background: var(--color-background-secondary);
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--color-borders);
}

.input-wrapper {
  flex: 1;
  background: var(--color-background-secondary);
  border-radius: 20px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  border: 1px solid var(--color-borders);
}

#text {
  flex: 1;
  padding: 10px 0;
}

button.send-btn {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 50%;
  background: #3390ec;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s;
  flex-shrink: 0;
}

button.send-btn:hover {
  background: #1b73b5;
}

button.send-btn svg {
  width: 18px;
  height: 18px;
  fill: white;
  transform: translateX(1px);
}

.empty {
  margin: auto;
  color: var(--color-text-secondary);
  font-size: 14px;
  background: rgba(255, 255, 255, 0.85);
  padding: 6px 14px;
  border-radius: 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}

/* Auth Modal Styles */
#auth-modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

#auth-modal.hidden {
  display: none;
}

.auth-card {
  background: var(--color-background);
  padding: 32px;
  border-radius: 16px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.auth-card h2 {
  margin: 0 0 8px 0;
  font-size: 22px;
  text-align: center;
}

.auth-input {
  background: var(--color-background-secondary);
  border: 1px solid var(--color-borders);
  padding: 12px 16px;
  border-radius: 10px;
  width: 100%;
  font-size: 14px;
}

.auth-btn {
  background: #3390ec;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 10px;
  font-weight: 500;
  font-size: 15px;
  cursor: pointer;
  width: 100%;
  height: auto;
}

.auth-btn:hover {
  background: #1b73b5;
}

.auth-switch {
  text-align: center;
  font-size: 13px;
  color: var(--color-text-secondary);
  cursor: pointer;
}

.auth-switch span {
  color: var(--color-links);
  font-weight: 500;
}

.error-msg {
  color: #e53935;
  font-size: 12px;
  text-align: center;
  min-height: 16px;
}
</style>
</head>
<body>

<div id="auth-modal" class="hidden">
  <div class="auth-card">
    <h2 id="auth-title">Sign In</h2>
    <div id="auth-error" class="error-msg"></div>
    <input type="text" id="auth-username" class="auth-input" placeholder="Username">
    <input type="password" id="auth-password" class="auth-input" placeholder="Password">
    <button id="auth-submit-btn" class="auth-btn" onclick="handleAuth()">Sign In</button>
    <div class="auth-switch" onclick="toggleAuthMode()">
      Don't have an account? <span id="auth-switch-text">Sign Up</span>
    </div>
  </div>
</div>

<header>
  <div class="header-left">
    <div class="header-avatar"><span>NF</span></div>
    <div class="header-info">
      <div class="header-title">NO FLITER</div>
      <div class="header-status" id="header-user-status">online</div>
    </div>
  </div>
  <button class="logout-btn" onclick="logout()">Log Out</button>
</header>

<div id="chat">
  <div class="empty">No messages</div>
</div>

<div class="controls">
  <input id="sender" readonly placeholder="Name">
  <div class="input-wrapper">
    <input id="text" placeholder="Write a message...">
  </div>
  <button class="send-btn" onclick="sendMessage()" title="Send">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></svg>
  </button>
</div>

<script>
let isSignUpMode = false;

function toggleAuthMode() {
  isSignUpMode = !isSignUpMode;
  document.getElementById('auth-title').textContent = isSignUpMode ? 'Create Account' : 'Sign In';
  document.getElementById('auth-submit-btn').textContent = isSignUpMode ? 'Sign Up' : 'Sign In';
  document.querySelector('.auth-switch').innerHTML = isSignUpMode 
    ? 'Already have an account? <span id="auth-switch-text">Sign In</span>' 
    : 'Don\'t have an account? <span id="auth-switch-text">Sign Up</span>';
  document.getElementById('auth-error').textContent = '';
}

async function checkSession() {
  try {
    const res = await fetch('/api/session', { credentials: 'include' });
    const data = await res.json();
    const modal = document.getElementById('auth-modal');

    if (res.ok && data.user) {
      modal.classList.add('hidden');
      document.getElementById('sender').value = data.user;
      document.getElementById('header-user-status').textContent = `Logged in as ${data.user}`;
      fetchMessages();
    } else {
      modal.classList.remove('hidden');
    }
  } catch {
    document.getElementById('auth-modal').classList.remove('hidden');
  }
}

async function handleAuth() {
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value.trim();
  const errorEl = document.getElementById('auth-error');

  if (!username || !password) {
    errorEl.textContent = 'Please fill in all fields.';
    return;
  }

  const endpoint = isSignUpMode ? '/api/signup' : '/api/login';
  
  try {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (!res.ok) {
      errorEl.textContent = data.error || 'Authentication failed.';
      return;
    }

    document.getElementById('auth-username').value = '';
    document.getElementById('auth-password').value = '';
    errorEl.textContent = '';
    checkSession();
  } catch {
    errorEl.textContent = 'Network error. Try again.';
  }
}

async function logout() {
  await fetch('/api/logout', { method: 'POST', credentials: 'include' });
  checkSession();
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
  }[m]));
}

function render(msgs) {
  const c = document.getElementById("chat");
  const currentSender = document.getElementById("sender").value.trim() || "";
  
  if (!msgs.length) {
    c.innerHTML = '<div class="empty">No messages</div>';
    return;
  }
  
  c.innerHTML = msgs.map(m => {
    const isOutgoing = m.sender.toLowerCase() === currentSender.toLowerCase();
    const avatarLetter = esc(m.sender).charAt(0).toUpperCase();
    
    return `
      <div class="row ${isOutgoing ? 'outgoing' : ''}">
        <div class="avatar">${avatarLetter}</div>
        <div class="msg">
          <div class="name">${esc(m.sender)}</div>
          <div class="message-content">${esc(m.text)}</div>
          <div class="meta-info">
            <span class="time">${m.timestamp || ''}</span>
            ${isOutgoing ? '<span class="checks">✓✓</span>' : ''}
          </div>
        </div>
      </div>`;
  }).join("");
  
  c.scrollTop = c.scrollHeight;
}

async function fetchMessages() {
  try {
    const r = await fetch('/api/chat', { credentials: 'include' });
    if (!r.ok) return;
    const d = await r.json();
    render(d.messages || []);
  } catch {}
}

async function sendMessage() {
  const text = document.getElementById("text").value.trim();
  if (!text) return;
  
  try {
    const r = await fetch('/api/chat', {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: 'include',
      body: JSON.stringify({ text })
    });
    if (!r.ok) return;
    document.getElementById("text").value = "";
    fetchMessages();
  } catch {}
}

document.getElementById("text").addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});

checkSession();
setInterval(fetchMessages, 2000);
</script>

</body>
</html>
